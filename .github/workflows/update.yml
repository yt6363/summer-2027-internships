name: Update the list
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update.py
      - name: Commit if the list changed
        run: |
          if git diff --quiet README.md; then echo "No change"; exit 0; fi
          git config user.name "summer-2027-internships bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git commit -m "Update the list"
          git push
